name: bike_buddy
description: "Bike Buddy - motorbike rental platform for Nepal. Mobile app for renters and owners."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.4
  # Current Android implementation recovers from invalid restored keys and
  # supports the Win32 version required by the current geolocator package.
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0

  # Maps and location
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # Current Android implementation avoids older service/plugin behaviour on
  # recent Android emulator images (including API 36+).
  geolocator: ^14.0.3
  permission_handler: ^11.3.1

  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Misc
  intl: ^0.20.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/bike-buddy-logo.png
